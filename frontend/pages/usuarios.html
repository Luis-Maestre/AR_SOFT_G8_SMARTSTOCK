<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartStock ERP — Usuarios</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">SmartStock</span><span class="tag">ERP</span></div>
    <nav>
      <a href="dashboard.html"><span class="icon">◆</span> Dashboard</a>
      <a href="productos.html"><span class="icon">▣</span> Productos</a>
      <a href="inventario.html"><span class="icon">▤</span> Inventario</a>
      <a href="movimientos.html"><span class="icon">↕</span> Movimientos</a>
      <a href="reposiciones.html"><span class="icon">↻</span> Reposiciones</a>
      <a href="reportes.html"><span class="icon">▦</span> Reportes</a>
      <a href="usuarios.html"><span class="icon">◐</span> Usuarios</a>
    </nav>
    <div class="sidebar-foot">SmartStock ERP · Fase 2<br>Prototipo estructurado</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <input class="search" type="text" placeholder="Buscar producto, lote o movimiento...">
      <div class="user"><span id="user-label">Cargando...</span><div class="avatar" id="user-avatar">?</div></div>
    </header>

    <main class="content">
      <div class="content-header">
        <div>
          <h1>Usuarios</h1>
          <p class="mt-0 text-muted">Administración de usuarios y roles del sistema</p>
        </div>
      </div>

      <div class="panel">
        <h2>Registrar usuario</h2>
        <form id="form-usuario" class="form-grid">
          <div class="field">
            <label for="nombre-usuario">Nombre</label>
            <input type="text" id="nombre-usuario" placeholder="Ej. Andrea" required>
          </div>
          <div class="field">
            <label for="apellido-usuario">Apellido</label>
            <input type="text" id="apellido-usuario" placeholder="Ej. Gómez" required>
          </div>
          <div class="field">
            <label for="correo-usuario">Correo</label>
            <input type="email" id="correo-usuario" placeholder="andrea@drogueriasanjose.co" required>
          </div>
          <div class="field">
            <label for="rol-usuario">Rol</label>
            <select id="rol-usuario" required></select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn">Registrar usuario</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Usuarios del sistema</h2>
        <div id="tabla-usuarios"></div>
      </div>
    </main>
  </div>
</div>

<script src="../js/data/mock-data.js"></script>
<script src="../js/models/usuario.js"></script>
<script src="../js/views/render.js"></script>
<script src="../js/controllers/navController.js"></script>
<script src="../js/controllers/usuarioController.js"></script>
</body>
</html>
