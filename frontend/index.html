<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTSTOCK ERP</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>SMARTSTOCK ERP</h1>
        <p>Sistema de gestión y control de inventario</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Productos</a>
        <a href="#">Inventario</a>
        <a href="#">Reportes</a>
    </nav>

    <main>
        <h2>Dashboard de Inventario</h2>

        <section>
            <div>
                <h3>Productos</h3>
                <p>125</p>
            </div>

            <div>
                <h3>Stock disponible</h3>
                <p>850</p>
            </div>

            <div>
                <h3>Alertas de stock</h3>
                <p>8</p>
            </div>
        </section>

        <section>
            <h2>Productos con bajo stock</h2>

            <table>
                <tr>
                    <th>Producto</th>
                    <th>Stock</th>
                    <th>Estado</th>
                </tr>

                <tr>
                    <td>Acetaminofen</td>
                    <td>5</td>
                    <td>Bajo</td>
                </tr>

                <tr>
                    <td>Dolex</td>
                    <td>8</td>
                    <td>Bajo</td>
                </tr>

                <tr>
                    <td>Ibuprofeno</td>
                    <td>15</td>
                    <td>Disponible</td>
                </tr>
            </table>
        </section>
    </main>

</body>
</html>
