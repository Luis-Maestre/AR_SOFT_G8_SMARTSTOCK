# La interfaz es una aplicacion de escritorio JavaFX, por eso no hay servicio

version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartstock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - smartstock_data:/var/lib/postgresql/data

volumes:
  smartstock_data:
