# SmartStock ERP - docker-compose (esqueleto Fase 2)
# Fase 2: solo referencia de como se orquestaran los servicios en Fase 3.
# No se ejecuta todavia porque el backend no tiene conexion real a BD.

version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartstock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - smartstock_data:/var/lib/postgresql/data

volumes:
  smartstock_data:
