# SmartStock ERP: backend (Spring Boot) + servicio de prediccion (Python).
# La base de datos es Supabase (nube), no se levanta aqui.
# La app de escritorio JavaFX se ejecuta fuera de Docker (ver desktop/README.md).
#
# Uso:  cp .env.example .env   (completar valores)   y luego:   docker compose up --build

services:
  prediccion:
    build: ./prediccion
    environment:
      PREDICTION_API_KEY: ${PREDICTION_API_KEY:-}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      PREDICTION_URL: http://prediccion:8000
    depends_on:
      - prediccion
    ports:
      - "8080:8080"
