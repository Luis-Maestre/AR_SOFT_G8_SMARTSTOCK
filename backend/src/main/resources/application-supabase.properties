# Perfil "supabase": PostgreSQL en la nube.
# 1) En Supabase ejecutar docs/ddl/smartstock_schema.sql (SQL Editor).
# 2) Definir las variables de entorno (ver .env.example):
#    SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD
# 3) Arrancar con SPRING_PROFILES_ACTIVE=supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# El esquema lo crea el script SQL; Hibernate solo lo verifica.
spring.jpa.hibernate.ddl-auto=validate
