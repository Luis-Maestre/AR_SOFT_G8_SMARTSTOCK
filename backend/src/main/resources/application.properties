# SmartStock ERP - Configuracion del servidor
spring.application.name=smartstock-backend
server.port=${PORT:8080}

# Perfil activo (cambiar con la variable SPRING_PROFILES_ACTIVE):
#   dev      -> base en memoria (H2) con datos de ejemplo. No requiere instalar nada.
#   supabase -> PostgreSQL en Supabase (o cualquier PostgreSQL). Ver application-supabase.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never

# Seguridad (JWT). En produccion JWT_SECRET es obligatoria y debe tener 32+ caracteres.
smartstock.jwt.secret=${JWT_SECRET:}
smartstock.jwt.expiracion-minutos=${JWT_EXPIRACION_MIN:480}

# Servicio de prediccion de demanda (Python / FastAPI)
smartstock.prediccion.url=${PREDICTION_URL:http://localhost:8000}
smartstock.prediccion.api-key=${PREDICTION_API_KEY:}
smartstock.prediccion.horizonte-dias=${PREDICTION_HORIZON_DAYS:14}
smartstock.prediccion.dias-historial=${PREDICTION_HISTORY_DAYS:90}

# Administrador inicial: solo se crea si la tabla de usuarios esta vacia
smartstock.admin.correo=${ADMIN_EMAIL:admin@smartstock.com}
smartstock.admin.password=${ADMIN_PASSWORD:}
smartstock.admin.nombre=${ADMIN_NAME:Administrador}
