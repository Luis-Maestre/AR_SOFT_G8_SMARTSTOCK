# Perfil "postgres": base de datos real.
# Primero crear la base "smartstock" y ejecutar docs/ddl/smartstock_schema.sql.
# Para usarlo: java -jar ... --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/smartstock
spring.datasource.username=postgres
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=validate
