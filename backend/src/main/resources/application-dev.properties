# Perfil "dev": base de datos en memoria con datos de ejemplo.
# Los datos se reinician cada vez que se apaga el servidor.
spring.datasource.url=jdbc:h2:mem:smartstock;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Solo para desarrollo. NO usar este secreto ni esta clave en produccion.
smartstock.jwt.secret=${JWT_SECRET:dev-secreto-solo-para-desarrollo-0123456789abcdef}
smartstock.admin.password=${ADMIN_PASSWORD:Admin123*}
